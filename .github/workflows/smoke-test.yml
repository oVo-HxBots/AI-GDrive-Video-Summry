name: Smoke test

on:
  pull_request:
  push:
    branches:
      - add/drive-video-agent

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install requests python-pptx tqdm
      - name: Run smoke test
        run: python tests/smoke_test.py
